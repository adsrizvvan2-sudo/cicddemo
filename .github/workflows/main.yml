
name: My First CI/CD Pipeline # Workflow ka naam

# Jab bhi main branch par push ya pull request hogi,
# workflow automatically run ho jayegi.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Jobs define karte hain jo workflow mein execute hongi.
jobs:
  build:
    # GitHub ka Ubuntu latest hosted runner use hoga.
    runs-on: ubuntu-latest

    # Steps define karte hain jo build job mein execute honge.
    steps:
      # GitHub repository ka code runner par checkout karega.
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Apne custom commands execute karenge.
      - name: My First Step
        run: |
          echo "This is DevOps Molvi"
          uname -a
