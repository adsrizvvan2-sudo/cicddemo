
# Workflow ka naam jo GitHub Actions tab mein show hoga.
name: My First CI/CD Pipeline

# Workflow kab run hogi?
on:
  # Jab main branch par koi naya code push hoga.
  push:
    branches:
      - main

  # Jab main branch ke liye Pull Request create ya update hogi.
  pull_request:
    branches:
      - main

# Jobs define karte hain jo workflow mein execute hongi.
jobs:
  build:
    # GitHub ka Ubuntu latest hosted runner use hoga.
    # Yaani GitHub apni machine provide karega jahan hamara code run hoga.
    runs-on: ubuntu-latest

    # Steps define karte hain jo build job mein execute honge.
    steps:

      # Step 1: GitHub repository ka code runner par download karega.
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Basic commands execute karenge.
      - name: Initialize Repo
        run: |
          echo "Hello world!"

          # uname -a Linux system ki information show karega.
          uname -a

      # Step 3: Check karenge ke Docker installed hai ya nahi.
      - name: Check Docker Installation
        run: |
          # Docker ka version show karega.
          docker --version

          # Docker images ki list show karega.
          docker images

      # Step 4: Docker ka hello-world container run karenge.
      - name: Run Docker Hello World
        run: |
          # Docker Hub se hello-world image download hogi
          # agar image pehle se available nahi hai.
          # Phir container create aur execute hoga.
          docker run hello-world
